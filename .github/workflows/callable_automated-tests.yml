name: Automated tests

on:
  workflow_call:

env:
  NODE_VERSION: 22

jobs:
  run-unit-tests:
    name: 🧪 Unit tests
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: unit-tests-turbo-${{ github.sha }}
          restore-keys: |
            unit-tests-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: |
          pnpm run test:ci -- --coverage
        env:
          CI: true
          VITE_BASE_URL: http://example.com

      - name: Push main app test report to artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vitest-report-main-app
          path: apps/main/vitest-report/
          retention-days: 14

  playwright:
    name: 🎭 E2E tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      matrix:
        browser: [chromium]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup kernel for react native, increase watchers
        run: echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf && sudo sysctl -p

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: ${{ matrix.browser }}-e2e-tests-turbo-${{ github.sha }}
          restore-keys: |
            ${{ matrix.browser }}-e2e-tests-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.browser }} browser
        run: npx playwright install --with-deps -- ${{ matrix.browser }}

      - name: Install serve package
        run: pnpm install -g serve

      - name: Run production build
        run: pnpm run build
        env:
          CI: true
          VITE_BASE_URL: http://example.com

      - name: Run tests
        run: pnpm run e2e:ci -- --browser=${{ matrix.browser }}
        env:
          CI: true
