name: Tests

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: 'Pre-existing approved vX.Y.Z-rc.N tag (never stable/latest)'
        required: true
        type: string
      candidate_sha:
        description: 'Approved full 40-character commit SHA identified by that tag'
        required: true
        type: string
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: 22
  PYTHONDONTWRITEBYTECODE: '1'
  CONSOLE_PUBLIC_RELEASES_ENABLED: ${{ vars.CONSOLE_PUBLIC_RELEASES_ENABLED }}
  RELEASE_FORBIDDEN_LITERAL: ${{ secrets.CONSOLE_FORBIDDEN_LITERAL }}
  RELEASE_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
  RELEASE_VERSION: ${{ inputs.candidate_tag }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate-preflight:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-frontend' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Enforce dormancy before checkout or API access
        run: |
          test "$GITHUB_REPOSITORY" = stellwerk-labs/platform-orchestrator-frontend
          test "$GITHUB_REF" = refs/heads/main
          test "$CONSOLE_PUBLIC_RELEASES_ENABLED" = true
      - name: Checkout approved candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable candidate and pre-provisioned reviewer approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          python3 scripts/console-release.py preflight
          gh api "repos/$GITHUB_REPOSITORY/environments/public-release-candidate" > "$RUNNER_TEMP/candidate-environment.json"
          python3 scripts/candidate-release.py "$CANDIDATE_TAG" "$CANDIDATE_SHA" \
            --environment-json "$RUNNER_TEMP/candidate-environment.json" --check-image-absent "$GITHUB_REPOSITORY"

  stable-preflight:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-frontend' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CONSOLE_PUBLIC_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - name: Enforce dormancy before checkout or API access
        run: |
          test "$GITHUB_REPOSITORY" = stellwerk-labs/platform-orchestrator-frontend
          test "$GITHUB_REF" = refs/heads/main
          test "$CONSOLE_PUBLIC_RELEASES_ENABLED" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require existing stable human-review environment and exact public source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/console-release.py preflight

  code-quality:
    name: 🚨 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.ref }}

      - name: Test publication contracts
        run: |
          python3 scripts/candidate-release_test.py
          python3 scripts/stable-release-preflight_test.py
          python3 scripts/console-release_test.py
          python3 scripts/release_workflow_test.py
          python3 scripts/console_sbom_test.py

      - name: Checkout the exact semantic-release action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stellwerk-labs/semantic-release-action
          ref: b1269e93b486873118eef1646bfcd46a9d23d3a3
          path: .release-tools
          persist-credentials: false

      - name: Test version assignment without credentials or network
        run: |
          set -euo pipefail
          docker build -t frontend-semantic-release-contract .release-tools
          docker run --rm --network none \
            --mount "type=bind,source=$PWD,target=/checkout,readonly" \
            --entrypoint sh frontend-semantic-release-contract \
            /checkout/scripts/test-release-versioning.sh
          rm -rf .release-tools

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: code-quality-turbo-${{ github.sha }}
          restore-keys: |
            code-quality-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check typescript
        run: pnpm run check-typescript

      - name: Test bundled dependency notices with Vite
        run: |
          pnpm run test:licenses
          node --test scripts/verify-runtime-notices.test.mjs

      - name: Test original-layer, final-tree and binary scanner contracts
        run: |
          bash scripts/install-release-tools.sh "$RUNNER_TEMP/release-tools"
          PATH="$RUNNER_TEMP/release-tools:$PATH" python3 scripts/release_content_test.py

      - name: Run eslint
        run: pnpm run lint

      - name: Detect code duplicates
        run: pnpm run detect-duplicates

      - name: Commit lint
        if: github.actor != 'dependabot[bot]' && github.ref != 'refs/heads/main'
        uses: wagoid/commitlint-github-action@6cf16efdf4da5277c791d335142c03a0bdf1766e # v6.2.1

  tests:
    name: 🧪 Test
    needs: code-quality
    uses: ./.github/workflows/callable_automated-tests.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
    secrets: inherit

  check-all-jobs-success:
    if: always()
    name: ☔️ Result
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - tests
    steps:
      - run: |
          if ${{ needs.tests.result != 'success' }} || ${{ needs.code-quality.result != 'success' }}; then
            echo "Some checks failed"
            exit 1
          fi

  release:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-frontend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [stable-preflight, check-all-jobs-success]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Source/write gate. Exact artifact publication has its own later gate.
    environment: public-release
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Repeat public source and reviewer checks before tag assignment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/console-release.py preflight
      - name: Assign stable version and tag
        id: release
        uses: stellwerk-labs/semantic-release-action@b1269e93b486873118eef1646bfcd46a9d23d3a3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate stable source, notes and unused destinations
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/stable-release-preflight.py "$RELEASE_TAG" "$SOURCE_SHA"

  build-release-image:
    if: >-
      !cancelled() && needs.check-all-jobs-success.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && needs.candidate-preflight.result == 'success') ||
       (github.event_name == 'push' && needs.release.result == 'success' && needs.release.outputs.version != ''))
    needs: [candidate-preflight, release, check-all-jobs-success]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_tag || needs.release.outputs.version }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      checksums_sha256: ${{ steps.identify.outputs.checksums_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified artifact tools
        run: |
          bash scripts/install-release-tools.sh "$RUNNER_TEMP/release-tools"
          bash scripts/install-oras.sh "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.0.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0
        with:
          version: v0.38.0
          driver-opts: |
            image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
            provenance-add-gha=false
      - name: First independent no-cache OCI build, never push
        run: |
          mkdir "$RUNNER_TEMP/console-first"
          bash scripts/build-console-image.sh "$RELEASE_VERSION" "$RELEASE_SOURCE_SHA" "$RUNNER_TEMP/console-first/image.oci.tar" "$RUNNER_TEMP/console-first/build.json"
      - name: Inspect and scan original layers and final first payload
        run: |
          mkdir "$RUNNER_TEMP/console-first/layout"
          tar -xf "$RUNNER_TEMP/console-first/image.oci.tar" -C "$RUNNER_TEMP/console-first/layout"
          timeout -k 5s 240s bash scripts/check-console-artifact.sh "$RUNNER_TEMP/console-first/layout" "$RUNNER_TEMP/console-first/inspection"
      - name: Second independent no-cache OCI build, never push
        run: |
          mkdir "$RUNNER_TEMP/console-second"
          bash scripts/build-console-image.sh "$RELEASE_VERSION" "$RELEASE_SOURCE_SHA" "$RUNNER_TEMP/console-second/image.oci.tar" "$RUNNER_TEMP/console-second/build.json"
      - name: Inspect second payload and compare reproducibility boundary
        run: |
          mkdir "$RUNNER_TEMP/console-second/layout"
          tar -xf "$RUNNER_TEMP/console-second/image.oci.tar" -C "$RUNNER_TEMP/console-second/layout"
          timeout -k 5s 240s bash scripts/check-console-artifact.sh "$RUNNER_TEMP/console-second/layout" "$RUNNER_TEMP/console-second/inspection"
          mkdir "$RUNNER_TEMP/console-release"
          python3 scripts/release_content.py compare "$RUNNER_TEMP/console-first/inspection/report.json" "$RUNNER_TEMP/console-second/inspection/report.json" > "$RUNNER_TEMP/console-release/reproducibility.json"
      - name: Catalogue real OS and bundled JS identities for each exact platform
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_SOURCE_SHA")"
          timeout -k 5s 300s bash scripts/generate-console-sbom.sh "$RUNNER_TEMP/console-first/layout" "$RUNNER_TEMP/console-first/inspection" "$RUNNER_TEMP/console-sbom"
      - name: Stage all final shipping bytes and scan metadata and archives
        id: identify
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/console-first/image.oci.tar" "$RUNNER_TEMP/console-release/console-image.oci.tar"
          for arch in amd64 arm64; do cp "$RUNNER_TEMP/console-sbom/$arch.spdx.json" "$RUNNER_TEMP/console-release/console-linux-$arch.spdx.json"; done
          python3 scripts/console-release.py stage "$RUNNER_TEMP/console-release" "$RUNNER_TEMP/console-first/layout" "$RUNNER_TEMP/console-first/inspection/report.json"
          timeout -k 5s 240s bash scripts/scan-release-content.sh "$RUNNER_TEMP/console-release" "$RELEASE_FORBIDDEN_LITERAL"
          echo "checksums_sha256=$(sha256sum "$RUNNER_TEMP/console-release/SHA256SUMS" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Preserve exact artifact before human publication review
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/console-release
          if-no-files-found: error
          retention-days: 14

  candidate-release:
    if: >-
      !cancelled() && github.repository == 'stellwerk-labs/platform-orchestrator-frontend' &&
      github.event_name == 'workflow_dispatch' &&
      needs.candidate-preflight.result == 'success' &&
      needs.check-all-jobs-success.result == 'success' && needs.build-release-image.result == 'success'
    needs:
      - candidate-preflight
      - check-all-jobs-success
      - build-release-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: public-release-candidate
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_CHECKSUMS_SHA256: ${{ needs.build-release-image.outputs.checksums_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable artifact identity from this exact producer run
        env:
          ARTIFACT_ID: ${{ needs.build-release-image.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build-release-image.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/console-artifact.json"
          python3 scripts/console-release.py artifact "$RUNNER_TEMP/console-artifact.json" "$ARTIFACT_ID" "$ARTIFACT_DIGEST"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-release-image.outputs.artifact_id }}
          path: ${{ runner.temp }}/console-release
          merge-multiple: true
      - name: Install verified publication tools
        run: |
          bash scripts/install-release-tools.sh "$RUNNER_TEMP/release-tools"
          bash scripts/install-oras.sh "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - name: Publish only the reviewed OCI bytes and verify exact signatures and assets
        run: bash scripts/publish-console-artifact.sh "$RUNNER_TEMP/console-release"

  stable-publish:
    if: >-
      !cancelled() && github.repository == 'stellwerk-labs/platform-orchestrator-frontend' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.version != '' &&
      needs.release.result == 'success' && needs.build-release-image.result == 'success'
    needs: [release, build-release-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: public-release
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      RELEASE_CHECKSUMS_SHA256: ${{ needs.build-release-image.outputs.checksums_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable artifact identity from this exact producer run
        env:
          ARTIFACT_ID: ${{ needs.build-release-image.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build-release-image.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/console-artifact.json"
          python3 scripts/console-release.py artifact "$RUNNER_TEMP/console-artifact.json" "$ARTIFACT_ID" "$ARTIFACT_DIGEST"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-release-image.outputs.artifact_id }}
          path: ${{ runner.temp }}/console-release
          merge-multiple: true
      - name: Install verified publication tools
        run: |
          bash scripts/install-release-tools.sh "$RUNNER_TEMP/release-tools"
          bash scripts/install-oras.sh "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - name: Publish only the reviewed OCI bytes and verify exact signatures and assets
        run: bash scripts/publish-console-artifact.sh "$RUNNER_TEMP/console-release"
