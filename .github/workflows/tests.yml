name: Tests

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: 'Pre-existing approved vX.Y.Z-rc.N tag (never stable/latest)'
        required: true
        type: string
      candidate_sha:
        description: 'Approved full 40-character commit SHA identified by that tag'
        required: true
        type: string
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: 22

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate-preflight:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-frontend' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout approved candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable candidate and pre-provisioned reviewer approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/public-release-candidate" > "$RUNNER_TEMP/candidate-environment.json"
          python3 scripts/candidate-release.py "$CANDIDATE_TAG" "$CANDIDATE_SHA" \
            --environment-json "$RUNNER_TEMP/candidate-environment.json"

  candidate-release:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-frontend' && github.event_name == 'workflow_dispatch'
    needs:
      - candidate-preflight
      - check-all-jobs-success
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: public-release-candidate
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Checkout tested immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate candidate and refuse existing publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/public-release-candidate" > "$RUNNER_TEMP/candidate-environment.json"
          python3 scripts/candidate-release.py "$CANDIDATE_TAG" "$CANDIDATE_SHA" \
            --environment-json "$RUNNER_TEMP/candidate-environment.json" \
            --check-image-absent "$GITHUB_REPOSITORY"

      - name: Reserve candidate release without creating a tag or changing latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          gh release create "$CANDIDATE_TAG" --verify-tag --prerelease --latest=false \
            --title "$CANDIDATE_TAG" --notes-file "docs/releases/$CANDIDATE_TAG.md"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Build and push exact candidate image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          file: ./apps/main/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/stellwerk-labs/platform-orchestrator-frontend:${{ inputs.candidate_tag }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.version=${{ inputs.candidate_tag }}
            org.opencontainers.image.revision=${{ inputs.candidate_sha }}

      - name: Verify candidate image by immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "ghcr.io/stellwerk-labs/platform-orchestrator-frontend@$IMAGE_DIGEST"

  code-quality:
    name: 🚨 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.ref }}

      - name: Test publication contracts
        run: |
          python3 scripts/candidate-release_test.py
          python3 scripts/stable-release-preflight_test.py

      - name: Checkout the exact semantic-release action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: stellwerk-labs/semantic-release-action
          ref: b1269e93b486873118eef1646bfcd46a9d23d3a3
          path: .release-tools
          persist-credentials: false

      - name: Test version assignment without credentials or network
        run: |
          set -euo pipefail
          docker build -t frontend-semantic-release-contract .release-tools
          docker run --rm --network none \
            --mount "type=bind,source=$PWD,target=/checkout,readonly" \
            --entrypoint sh frontend-semantic-release-contract \
            /checkout/scripts/test-release-versioning.sh
          rm -rf .release-tools

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: code-quality-turbo-${{ github.sha }}
          restore-keys: |
            code-quality-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check typescript
        run: pnpm run check-typescript

      - name: Run eslint
        run: pnpm run lint

      - name: Detect code duplicates
        run: pnpm run detect-duplicates

      - name: Commit lint
        if: github.actor != 'dependabot[bot]' && github.ref != 'refs/heads/main'
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  tests:
    name: 🧪 Test
    needs: code-quality
    uses: ./.github/workflows/callable_automated-tests.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
    secrets: inherit

  check-all-jobs-success:
    if: always()
    name: ☔️ Result
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - tests
    steps:
      - run: |
          if ${{ needs.tests.result != 'success' }} || ${{ needs.code-quality.result != 'success' }}; then
            echo "Some checks failed"
            exit 1
          fi

  release:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-frontend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check-all-jobs-success
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assign stable version and tag
        id: release
        uses: stellwerk-labs/semantic-release-action@b1269e93b486873118eef1646bfcd46a9d23d3a3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate stable source, notes, and unused destinations
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/stable-release-preflight.py "$RELEASE_TAG" "$SOURCE_SHA"

      - name: Reserve stable draft with reviewed notes
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --draft --latest=false \
            --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"

      - name: Login to GitHub Container Registry
        if: steps.release.outputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.release.outputs.version != ''
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0

      - name: Set up Docker Buildx
        if: steps.release.outputs.version != ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Set up QEMU
        if: steps.release.outputs.version != ''
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0

      - name: Set up Docker Buildx
        if: steps.release.outputs.version != ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Build and push image
        if: steps.release.outputs.version != ''
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          file: ./apps/main/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/stellwerk-labs/${{ github.event.repository.name }}:${{ steps.release.outputs.version }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify published image
        if: steps.release.outputs.version != ''
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "ghcr.io/stellwerk-labs/platform-orchestrator-frontend@${IMAGE_DIGEST}"

      - name: Publish verified stable release
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false --latest
