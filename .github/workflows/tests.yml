name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: 22

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-quality:
    name: 🚨 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: code-quality-turbo-${{ github.sha }}
          restore-keys: |
            code-quality-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check typescript
        run: pnpm run check-typescript

      - name: Run eslint
        run: pnpm run lint

      - name: Detect code duplicates
        run: pnpm run detect-duplicates

      - name: Commit lint
        if: github.actor != 'dependabot[bot]' && github.ref != 'refs/heads/main'
        uses: wagoid/commitlint-github-action@6cf16efdf4da5277c791d335142c03a0bdf1766e # v6.2.1

  tests:
    name: 🧪 Test
    needs: code-quality
    uses: ./.github/workflows/callable_automated-tests.yml
    secrets: inherit

  check-all-jobs-success:
    if: always()
    name: ☔️ Result
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - tests
    steps:
      - run: |
          if ${{ needs.tests.result != 'success' }} || ${{ needs.code-quality.result != 'success' }}; then
            echo "Some checks failed"
            exit 1
          fi

  release:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-frontend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check-all-jobs-success
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create semantic release
        id: release
        uses: stellwerk-labs/semantic-release-action@b1269e93b486873118eef1646bfcd46a9d23d3a3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: steps.release.outputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.release.outputs.version != ''
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0

      - name: Set up Docker Buildx
        if: steps.release.outputs.version != ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Build and push image
        if: steps.release.outputs.version != ''
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          file: ./apps/main/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/stellwerk-labs/${{ github.event.repository.name }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify published image
        if: steps.release.outputs.version != ''
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          docker buildx imagetools inspect "ghcr.io/stellwerk-labs/platform-orchestrator-frontend@${IMAGE_DIGEST}"
